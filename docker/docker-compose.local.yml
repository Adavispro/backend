version: '3.8'

services:
  # ============================================
  # MongoDB Database
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: adavis-mongodb
    restart: unless-stopped
    ports:
      - "37017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Admin123!
      MONGO_INITDB_DATABASE: adavis_platform
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./seed_data_iiot_file.js:/docker-entrypoint-initdb.d/seed_data_iiot_file.js:ro
      - ./seed_data_iiot_file.js:/seed/seed_data_iiot_file.js:ro
      - ../sample_ingestion_data:/docker-entrypoint-initdb.d/sample_ingestion_data:ro
      - ../sample_ingestion_data:/sample_ingestion_data:ro
    networks:
      - adavis-network
    command: ["mongod", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27017"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================
  # MongoDB Express (Web UI for MongoDB)
  # ============================================
  mongo-express:
    image: mongo-express:latest
    container_name: adavis-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: Admin123!
      ME_CONFIG_MONGODB_URL: mongodb://admin:Admin123!@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - adavis-network
    depends_on:
      mongodb:
        condition: service_healthy

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7.2-alpine
    container_name: adavis-redis
    restart: unless-stopped
    ports:
      - "8379:6379"
    command: redis-server --appendonly yes --requirepass Redis123! --port 6379
    volumes:
      - redis_data:/data
    networks:
      - adavis-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Redis123!", "--raw", "PING"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================
  # Redis Insight - Official Redis UI
  # ============================================
  redis-insight:
    image: redis/redisinsight:latest
    container_name: adavis-redis-insight
    restart: unless-stopped
    ports:
      - "8085:5540"
    environment:
      - RI_APP_HOST=0.0.0.0
      - RI_APP_PORT=5540
    volumes:
      - redis_insight_data:/db
    networks:
      - adavis-network
    depends_on:
      redis:
        condition: service_healthy

  # ============================================
  # Kafka (Strimzi KRaft mode)
  # ============================================
  redpanda:
    image: quay.io/strimzi/kafka:latest-kafka-3.7.0
    container_name: adavis-redpanda
    restart: unless-stopped
    ports:
      - "10092:9092"
    environment:
      - LOG_DIR=/tmp/kafka-logs
    command:
      - /bin/bash
      - -c
      - |
        mkdir -p /tmp/kafka-logs
        export LOG_DIR=/tmp/kafka-logs
        if [ ! -f /tmp/kraft-combined-logs/meta.properties ]; then
          CLUSTER_ID=$$(/opt/kafka/bin/kafka-storage.sh random-uuid)
          /opt/kafka/bin/kafka-storage.sh format -t $$CLUSTER_ID -c /opt/kafka/config/kraft/server.properties --ignore-formatted
        fi
        exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties \
          --override listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
          --override advertised.listeners=PLAINTEXT://localhost:10092 \
          --override node.id=1 \
          --override process.roles=broker,controller \
          --override controller.quorum.voters=1@127.0.0.1:9093 \
          --override controller.listener.names=CONTROLLER \
          --override listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    volumes:
      - redpanda_data:/tmp/kraft-combined-logs
    networks:
      - adavis-network
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ============================================
  # MailHog (SMTP Test Server)
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: adavis-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - adavis-network

networks:
  adavis-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  redis_insight_data:
    driver: local
  redpanda_data:
    driver: local